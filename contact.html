<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | AI Voice Cost Calculator</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=130" />
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="logo-flex">
                <img src="logo.svg" width="32" height="32" alt="Logo"/>
                <span class="logo-text">AI Voice<span class="highlight">Calc</span></span>
            </a>
            <div class="nav-actions">
                <a href="/" class="preset-btn">← Back to Calculator</a>
            </div>
        </div>
    </header>

    <main class="main-wrapper">
        <div class="calc-panel" style="max-width: 800px; margin: 40px auto;">
            <h1 style="font-size: 28px; margin-bottom: 16px;">Contact Us</h1>
            <p style="color: var(--text-sub); line-height: 1.6; margin-bottom: 24px;">
                Have questions, updated provider rates, feature requests, or partnership inquiries? Reach out to us below.
            </p>
            
            <div class="input-field">
                <label>Your Email</label>
                <input type="email" placeholder="name@company.com" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px;">
            </div>
            
            <div class="input-field">
                <label>Message / Rate Update Suggestion</label>
                <textarea rows="5" placeholder="How can we improve AI Voice Calc?" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-family: inherit;"></textarea>
            </div>

            <button class="action-btn primary-btn" onclick="alert('Thank you for reaching out! We will get back to you shortly.')" style="width: 100%; padding: 14px;">Send Message</button>
        </div>
    </main>

    <footer>
        <p>© 2026 AI Voice Cost Calculator. Built for Developers & Enterprise Teams.</p>
    </footer>
</body>
</html>
